<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カム測定ツール</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .value { font-size: 3em; font-weight: bold; color: #007bff; }
        .unit { font-size: 0.5em; color: #666; }
        button { padding: 15px 30px; font-size: 1.2em; border-radius: 30px; border: none; background: #28a745; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>カム測定モニター</h1>
        <button onclick="connectBLE()">ESP32に接続する</button>
        <p>角度: <span id="angle" class="value">0.0</span><span class="unit">°</span></p>
        <p>リフト: <span id="lift" class="value">0.000</span><span class="unit">mm</span></p>
        <p id="status">接続待機中...</p>
    </div>

    <script>
        async function connectBLE() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] // ESP32側のUUIDに合わせて変更
                });
                
                document.getElementById('status').innerText = "接続中...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
                const characteristic = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');

                await characteristic.startNotifications();
                document.getElementById('status').innerText = "通信中";

                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const data = event.target.value;
                    // ESP32からFloat32型で「角度, リフト量」の順で送る想定
                    const angle = data.getFloat32(0, true);
                    const lift = data.getFloat32(4, true);
                    
                    document.getElementById('angle').innerText = angle.toFixed(1);
                    document.getElementById('lift').innerText = lift.toFixed(3);
                });
            } catch (error) {
                document.getElementById('status').innerText = "エラー: " + error;
            }
        }
    </script>
</body>
</html>
